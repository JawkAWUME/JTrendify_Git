<div class="flex justify-center items-center min-h-screen bg-gray-900 text-white">
    <div class="w-full max-w-md p-8 bg-gray-800 rounded-3xl shadow-[5px_5px_15px_rgba(0,0,0,0.3),_-5px_-5px_15px_rgba(255,255,255,0.05)] transform transition-all duration-500">
  
      <div class="flex justify-between items-center mb-6">
        <span class="text-lg font-bold">Connexion</span>
        <span class="text-sm text-gray-400">
          Pas encore de compte ?
          <a routerLink="/signup" class="text-blue-400">Créer un compte</a>
        </span>
      </div>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-sm text-gray-300 mb-1">Adresse Email</label>
          <input type="email" formControlName="email"
            class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 text-white"
            placeholder="email@example.com">
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-red-500 text-sm mt-1">
            Adresse email invalide
          </div>
        </div>
  
        <div class="mb-4">
          <label class="block text-sm text-gray-300 mb-1">Mot de passe</label>
          <input type="password" formControlName="password"
            class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 text-white"
            placeholder="••••••••">
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-sm mt-1">
            Le mot de passe est requis
          </div>
        </div>
  
        <button type="submit"
          class="w-full py-2 mt-4 bg-indigo-600 rounded-md text-white hover:bg-indigo-700 transition duration-300"
          [disabled]="isLoading || loginForm.invalid">
          {{ isLoading ? 'Connexion...' : 'Se connecter' }}
        </button>
  
        <div class="text-right mt-3 text-sm">
          <a routerLink="/forgot-password" class="text-blue-400 hover:underline">Mot de passe oublié ?</a>
        </div>
      </form>
    </div>
  </div>
